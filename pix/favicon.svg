<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <!-- Brand gradient -->
    <linearGradient id="fBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8652B"/>
      <stop offset="50%" style="stop-color:#F08042"/>
      <stop offset="100%" style="stop-color:#F5A623"/>
    </linearGradient>

    <!-- Background fill -->
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#16213E"/>
    </linearGradient>

    <!-- Node accent -->
    <linearGradient id="fNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9D5CFF"/>
      <stop offset="100%" style="stop-color:#F08042"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="48" height="48" rx="10" ry="10" fill="url(#fBg)"/>

  <!-- U lettermark - scaled and centered -->
  <path d="M14 10 L14 28 Q14 38 24 38 Q34 38 34 28 L34 10"
        fill="none" stroke="url(#fBrand)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neural network nodes -->
  <!-- Primary node -->
  <circle cx="34" cy="10" r="3.5" fill="#F08042"/>
  <circle cx="34" cy="10" r="1.8" fill="#1A1A2E"/>

  <!-- Satellite nodes -->
  <circle cx="41" cy="6" r="2.5" fill="#9D5CFF"/>
  <circle cx="41" cy="6" r="1" fill="#1A1A2E"/>

  <circle cx="42" cy="16" r="2.5" fill="#F5A623"/>
  <circle cx="42" cy="16" r="1" fill="#1A1A2E"/>

  <!-- Connection lines -->
  <line x1="34" y1="10" x2="41" y2="6" stroke="url(#fNode)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="10" x2="42" y2="16" stroke="url(#fBrand)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Top sparkle -->
  <circle cx="44" cy="3" r="1.2" fill="#F5A623" opacity="0.8"/>
</svg>
